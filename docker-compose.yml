name: carl-brokerage

services:
  postgres:
    image: postgres:16
    env_file:
      - path: .env
        format: raw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        format: raw
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tradingapp}
    ports:
      - "6432:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
