spring:
  application:
    name: trading-app-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tradingapp}
    username: ${POSTGRES_USER:db-user}
    password: ${POSTGRES_PASSWORD:db-p@$$w0rd}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
  mapper-locations: classpath:mybatis/*.xml

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789-0123456789-0123456789}
    ttl-minutes: ${APP_JWT_TTL_MINUTES:120}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080

logging:
  level:
    com.carl.trading: INFO
